plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "FluxysGUI"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test { useJUnitPlatform() }

loom {
	runs {
		// gradlew runPreview: opens every page in a dev world and screenshots it (see cleanui.dev.Preview)
		preview {
			inherit client
			configName = "Preview"
			vmArg "-Dcleanui.preview=true"
			vmArg "-Dcleanui.preview.only=" + (project.findProperty("only") ?: "") // e.g. gradlew runPreview -Ponly=skills,pets
			programArgs "--quickPlaySingleplayer", "New World", "--width", "1920", "--height", "1080"
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
